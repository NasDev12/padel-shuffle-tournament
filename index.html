<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Padel Shuffle — Bracket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --indigo-900:#1B1350; --indigo-700:#2E1F8F; --indigo-500:#4B3ADB; --indigo-300:#8A7CF0;
  --green-600:#3E8A22; --green-500:#5BC236; --green-100:#E8F7E0;
  --gold:#B8892B; --gold-bg:#FBF3E1;
  --silver:#6B7280; --silver-bg:#EEF0F3;
  --paper:#FAF9FC; --card:#FFFFFF; --ink:#1A1730; --line:#E4E1F0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141026; --card:#1D1836; --ink:#F1EFFB; --line:#332C57;
    --green-100:#1D2E14; --gold-bg:#2A2110; --silver-bg:#23232B;
  }
}
:root[data-theme="dark"]{
  --paper:#141026; --card:#1D1836; --ink:#F1EFFB; --line:#332C57;
  --green-100:#1D2E14; --gold-bg:#2A2110; --silver-bg:#23232B;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  background:var(--paper); color:var(--ink); font-family:'Inter',system-ui,sans-serif;
  padding:0 0 3rem; overflow-x:hidden;
}
.wrap{max-width:760px; margin:0 auto; padding:0 1.1rem;}
header.hero{
  background:linear-gradient(120deg,var(--indigo-900),var(--indigo-500) 70%, var(--green-500) 130%);
  padding:2.2rem 1.1rem 2.6rem; color:#fff;
}
.hero-inner{max-width:760px; margin:0 auto; display:flex; align-items:center; gap:1rem;}
.hero-inner img{width:64px; height:64px; flex:none; filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));}
.hero h1{
  font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:2.1rem; line-height:1;
  margin:0; letter-spacing:.01em;
}
.hero p{margin:.35rem 0 0; opacity:.85; font-size:.95rem;}
.tabs{display:flex; gap:.5rem; margin:1.4rem 0 1rem;}
.tabs button{
  flex:1; padding:.7rem .5rem; border-radius:10px; border:1.5px solid var(--line);
  background:var(--card); color:var(--ink); font:600 .95rem 'Inter'; cursor:pointer;
}
.tabs button[aria-selected="true"]{background:var(--indigo-500); border-color:var(--indigo-500); color:#fff;}
.tabs button:disabled{opacity:.4; cursor:not-allowed;}
.toggle{display:flex; gap:.5rem; margin-bottom:1.2rem;}
.toggle button{
  flex:1; padding:.6rem; border-radius:999px; border:1.5px solid var(--line);
  background:var(--card); color:var(--ink); font:700 .85rem 'Inter'; cursor:pointer;
}
.toggle button.active.court0{background:var(--indigo-500); border-color:var(--indigo-500); color:#fff;}
.toggle button.active.court1{background:var(--green-600); border-color:var(--green-600); color:#fff;}
.toggle button.active.gold{background:var(--gold); border-color:var(--gold); color:#fff;}
.toggle button.active.silver{background:var(--silver); border-color:var(--silver); color:#fff;}
.names{display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin-bottom:1.3rem;}
.names input{
  width:100%; padding:.55rem .7rem; border-radius:8px; border:1.5px solid var(--line);
  background:var(--card); color:var(--ink); font:600 .9rem 'Inter';
}
h2.section-label{font-family:'Barlow Condensed'; font-weight:700; font-size:1.15rem; margin:0 0 .6rem;}
.match{
  display:flex; align-items:center; justify-content:space-between; gap:.6rem;
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:.75rem .9rem; margin-bottom:.55rem;
}
.match .team{flex:1; font-weight:600; font-size:.92rem; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.match .team.right{text-align:right;}
.match .score{
  width:2.6rem; text-align:center; padding:.4rem 0; border-radius:8px; border:1.5px solid var(--line);
  background:var(--paper); color:var(--ink); font:700 1rem 'Inter';
}
.match .vs{font-size:.75rem; opacity:.5; padding:0 .2rem;}
table.standings{width:100%; border-collapse:collapse; margin:1rem 0 1.6rem; font-size:.88rem;}
table.standings th, table.standings td{padding:.5rem .4rem; text-align:center; border-bottom:1px solid var(--line);}
table.standings th:first-child, table.standings td:first-child{text-align:left;}
table.standings thead th{font-weight:600; opacity:.55; font-size:.72rem; text-transform:uppercase; letter-spacing:.04em;}
table.standings tr.q1 td:first-child, table.standings tr.q2 td:first-child{color:var(--green-600); font-weight:700;}
.pill{display:inline-block; font-size:.68rem; font-weight:700; padding:.1rem .45rem; border-radius:999px; margin-left:.35rem;}
.pill.gold{background:var(--gold-bg); color:var(--gold);}
.pill.silver{background:var(--silver-bg); color:var(--silver);}
.advance{
  width:100%; padding:.9rem; border-radius:12px; border:none; margin-top:.4rem;
  background:var(--green-500); color:#fff; font:700 1rem 'Inter'; cursor:pointer;
}
.advance:disabled{background:var(--line); color:var(--ink); opacity:.5; cursor:not-allowed;}
.hint{font-size:.8rem; opacity:.6; margin:.4rem 0 1rem;}
.round-label{font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; opacity:.45; margin:.9rem 0 .4rem;}
.round-label:first-child{margin-top:0;}
.rest-divider{
  display:flex; align-items:center; gap:.6rem; margin:1rem 0; color:var(--green-600); font-weight:700; font-size:.8rem;
}
.rest-divider::before, .rest-divider::after{content:''; flex:1; height:1px; background:var(--line);}
.reset{background:none; border:none; color:var(--indigo-500); font:600 .82rem 'Inter'; text-decoration:underline; cursor:pointer; padding:0; margin-top:1.5rem;}
.gold-head, .silver-head{
  border-radius:14px; padding:1rem 1.1rem; margin-bottom:1.2rem; color:#fff;
}
.gold-head{background:linear-gradient(120deg,#8A6112,var(--gold));}
.silver-head{background:linear-gradient(120deg,#4B5158,var(--silver));}
.gold-head h2, .silver-head h2{font-family:'Barlow Condensed'; margin:0; font-size:1.3rem;}
.gold-head p, .silver-head p{margin:.2rem 0 0; font-size:.8rem; opacity:.9;}
</style>
</head>

iigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigD/2Q==" alt="PS logo">
    <div>
      <h1>PADEL SHUFFLE</h1>
      <p>Group stage &rarr; Gold &amp; Silver knockout groups</p>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="tabs">
    <button id="tabStage1" aria-selected="true">Stage 1 · Groups</button>
    <button id="tabStage2" disabled>Stage 2 · Gold &amp; Silver</button>
  </nav>

  <section id="stage1">
    <div class="toggle" id="courtToggle">
      <button class="active court0" data-court="0">Court 1</button>
      <button class="court1" data-court="1">Court 2</button>
    </div>

    <h2 class="section-label">Teams</h2>
    <div class="names" id="names1"></div>

    <h2 class="section-label">Matches — 2 games, rest, then the decider</h2>
    <div id="matches1"></div>

    <h2 class="section-label">Standings</h2>
    <table class="standings" id="standings1"></table>
    <p class="hint">Top 2 in each court advance to the Gold group · 3rd &amp; 4th go to Silver.</p>
    <button class="advance" id="advanceBtn" disabled>Enter all scores to advance</button>
  </section>

  <section id="stage2" hidden>
    <div class="toggle" id="groupToggle">
      <button class="active gold" data-group="gold">Gold Group</button>
      <button class="silver" data-group="silver">Silver Group</button>
    </div>
    <div id="stage2Head"></div>
    <h2 class="section-label">Matches — 2 games, rest, then the decider</h2>
    <div id="matches2"></div>
    <h2 class="section-label">Standings</h2>
    <table class="standings" id="standings2"></table>
  </section>

  <button class="reset" id="resetBtn">Reset whole tournament</button>
</div>

<script>
const PAIRS = [[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]]; // 3 matches per team, 6 per group
const ROUNDS = [[0,1],[2,3],[4,5]]; // pair indices per round — rest sits between round 2 and 3
const STORE_KEY = 'padel-shuffle-state-v3';

function blankGroup(defaultNames){
  return {
    names: defaultNames.slice(),
    scores: PAIRS.map(()=>[null,null])
  };
}

function defaultState(){
  return {
    activeCourt: 0,
    activeGroup: 'gold',
    stage: 1,
    groups: [
      blankGroup(['Team 1','Team 2','Team 3','Team 4']),
      blankGroup(['Team 5','Team 6','Team 7','Team 8'])
    ],
    stage2: null // { gold:{names,scores}, silver:{names,scores} } once advanced
  };
}

let state = load();

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return defaultState();
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

function standingsFor(group){
  const rows = group.names.map((n,i)=>({i, name:n, w:0, d:0, l:0, pf:0, pa:0, played:0}));
  PAIRS.forEach(([a,b],m)=>{
    const [sa,sb] = group.scores[m];
    if(sa===null || sb===null || sa==='' || sb==='') return;
    const na = Number(sa), nb = Number(sb);
    rows[a].pf+=na; rows[a].pa+=nb; rows[a].played++;
    rows[b].pf+=nb; rows[b].pa+=na; rows[b].played++;
    if(na>nb){rows[a].w++; rows[b].l++;}
    else if(nb>na){rows[b].w++; rows[a].l++;}
    else {rows[a].d++; rows[b].d++;}
  });
  rows.forEach(r=>r.diff=r.pf-r.pa);
  rows.sort((x,y)=> y.w-x.w || y.d-x.d || y.diff-x.diff || y.pf-x.pf);
  return rows;
}

function groupComplete(group){
  return group.scores.every(([a,b])=> a!==null && b!==null && a!=='' && b!=='');
}

function renderNames(){
  const g = state.groups[state.activeCourt];
  const el = document.getElementById('names1');
  el.innerHTML = g.names.map((n,i)=>
    `<input value="${escapeHtml(n)}" data-idx="${i}" class="teamNameInput">`
  ).join('');
  el.querySelectorAll('.teamNameInput').forEach(inp=>{
    inp.addEventListener('input', e=>{
      g.names[Number(e.target.dataset.idx)] = e.target.value;
      save(); renderMatches1(); renderStandings1();
    });
  });
}

function matchRow(group, m, editable, keyPrefix){
  const [a,b] = PAIRS[m];
  const [sa,sb] = group.scores[m];
  return `<div class="match">
    <span class="team">${escapeHtml(group.names[a])}</span>
    <input class="score" type="number" min="0" inputmode="numeric" data-m="${m}" data-side="0" data-key="${keyPrefix}"
      value="${sa===null?'':sa}" ${editable?'':'disabled'}>
    <span class="vs">–</span>
    <input class="score" type="number" min="0" inputmode="numeric" data-m="${m}" data-side="1" data-key="${keyPrefix}"
      value="${sb===null?'':sb}" ${editable?'':'disabled'}>
    <span class="team right">${escapeHtml(group.names[b])}</span>
  </div>`;
}

function renderRoundedMatches(group, elId){
  const el = document.getElementById(elId);
  let html = '';
  ROUNDS.forEach((pairIdxs, r)=>{
    html += `<div class="round-label">Round ${r+1}</div>`;
    html += pairIdxs.map(m=>matchRow(group,m,true,elId)).join('');
    if(r===1) html += `<div class="rest-divider">Rest</div>`;
  });
  el.innerHTML = html;
}

function renderMatches1(){
  const g = state.groups[state.activeCourt];
  renderRoundedMatches(g, 'matches1');
  const el = document.getElementById('matches1');
  el.querySelectorAll('.score').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const m = Number(e.target.dataset.m), side = Number(e.target.dataset.side);
      g.scores[m][side] = e.target.value;
      save(); renderStandings1(); updateAdvanceButton();
    });
  });
}

function standingsTable(group, elId, showPills){
  const rows = standingsFor(group);
  const el = document.getElementById(elId);
  el.innerHTML = `<thead><tr><th>Team</th><th>W</th><th>D</th><th>L</th><th>+/-</th></tr></thead><tbody>` +
    rows.map((r,pos)=>{
      const cls = showPills ? (pos<2?'q1':pos<4?'':'') : '';
      let pill='';
      if(showPills){
        pill = pos<2 ? '<span class="pill gold">Gold</span>' : '<span class="pill silver">Silver</span>';
      }
      return `<tr class="${cls}"><td>${escapeHtml(r.name)}${pill}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.diff>0?'+':''}${r.diff}</td></tr>`;
    }).join('') + '</tbody>';
}

function renderStandings1(){
  standingsTable(state.groups[state.activeCourt], 'standings1', true);
}

function updateAdvanceButton(){
  const btn = document.getElementById('advanceBtn');
  const ready = state.groups.every(groupComplete);
  btn.disabled = !ready;
  btn.textContent = ready ? 'Advance to Gold & Silver' : 'Enter all scores to advance';
}

function buildStage2(){
  const c1 = standingsFor(state.groups[0]);
  const c2 = standingsFor(state.groups[1]);
  const gold = [c1[0], c2[0], c1[1], c2[1]].map(r=>r.name);
  const silver = [c1[2], c2[2], c1[3], c2[3]].map(r=>r.name);
  state.stage2 = { gold: blankGroup(gold), silver: blankGroup(silver) };
  state.stage = 2;
  save();
}

function renderStage2Head(){
  const el = document.getElementById('stage2Head');
  if(state.activeGroup==='gold'){
    el.innerHTML = `<div class="gold-head"><h2>Gold Group</h2><p>Top 2 finishers from each court — for 1st–4th place</p></div>`;
  } else {
    el.innerHTML = `<div class="silver-head"><h2>Silver Group</h2><p>3rd &amp; 4th finishers from each court — for 5th–8th place</p></div>`;
  }
}

function renderMatches2(){
  const g = state.stage2[state.activeGroup];
  renderRoundedMatches(g, 'matches2');
  const el = document.getElementById('matches2');
  el.querySelectorAll('.score').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const m = Number(e.target.dataset.m), side = Number(e.target.dataset.side);
      g.scores[m][side] = e.target.value;
      save(); renderStandings2();
    });
  });
}
function renderStandings2(){
  standingsTable(state.stage2[state.activeGroup], 'standings2', false);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showStage(n){
  state.stage = Math.max(state.stage, n===2?2:state.stage);
  document.getElementById('stage1').hidden = n!==1;
  document.getElementById('stage2').hidden = n!==2;
  document.getElementById('tabStage1').setAttribute('aria-selected', n===1);
  document.getElementById('tabStage2').setAttribute('aria-selected', n===2);
  if(n===2){ renderStage2Head(); renderMatches2(); renderStandings2(); }
}

document.getElementById('courtToggle').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-court]');
  if(!btn) return;
  state.activeCourt = Number(btn.dataset.court);
  document.querySelectorAll('#courtToggle button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  save(); renderNames(); renderMatches1(); renderStandings1();
});

document.getElementById('groupToggle').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-group]');
  if(!btn) return;
  state.activeGroup = btn.dataset.group;
  document.querySelectorAll('#groupToggle button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  save(); renderStage2Head(); renderMatches2(); renderStandings2();
});

document.getElementById('advanceBtn').addEventListener('click', ()=>{
  buildStage2();
  document.getElementById('tabStage2').disabled = false;
  showStage(2);
});

document.getElementById('tabStage1').addEventListener('click', ()=>showStage(1));
document.getElementById('tabStage2').addEventListener('click', ()=>{ if(state.stage2) showStage(2); });

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(!confirm('Reset all scores and team names?')) return;
  state = defaultState();
  save();
  init();
});

function init(){
  document.querySelectorAll('#courtToggle button').forEach(b=>b.classList.toggle('active', Number(b.dataset.court)===state.activeCourt));
  document.querySelectorAll('#groupToggle button').forEach(b=>b.classList.toggle('active', b.dataset.group===state.activeGroup));
  renderNames(); renderMatches1(); renderStandings1(); updateAdvanceButton();
  if(state.stage2){
    document.getElementById('tabStage2').disabled = false;
  }
  showStage(state.stage2 && state.stage===2 ? 2 : 1);
}
init();
</script>
